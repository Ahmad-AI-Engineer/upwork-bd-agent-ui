x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  image: upwork-bid-agent-airflow:latest
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-please-change-this-secret}
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USER:-admin}:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json.generated
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__INTERNAL_API_URL: http://airflow-apiserver:8080
    PYTHONPATH: /opt/airflow/upwork/src
    UPWORK_CONFIG_PATH: /opt/airflow/upwork/config/domains.json
    UPWORK_JOBS_DIR: /opt/airflow/upwork/jobs
    UPWORK_LOGS_DIR: /opt/airflow/upwork/logs
    UPWORK_TOKEN_CACHE_PATH: /opt/airflow/upwork/.secrets/upwork_mcp_tokens.json
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/upwork/src
    - ./config:/opt/airflow/upwork/config
    - ./jobs:/opt/airflow/upwork/jobs
    - ./logs:/opt/airflow/upwork/logs
    - ./.secrets:/opt/airflow/upwork/.secrets
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  airflow-apiserver:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        exec airflow api-server
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-apiserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      postgres:
        condition: service_healthy
      airflow-apiserver:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-db:
  airflow-logs:
