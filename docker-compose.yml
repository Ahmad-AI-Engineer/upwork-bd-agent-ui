x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
  image: upwork-bid-agent:latest
  environment: &common-env
    UPWORK_HEADLESS: "1"
    UPWORK_CRM_ENDPOINT: ${UPWORK_CRM_ENDPOINT:-}
  volumes:
    - ./orchestration:/app/orchestration
    - ./ui:/app/ui
    - ./config:/app/config
    - ./.secrets:/app/.secrets
  restart: unless-stopped

services:
  poller:
    <<: *common
    command: ["python", "orchestration/job_poller.py", "--daemon"]

  config-ui:
    <<: *common
    command: ["uvicorn", "config_ui:app", "--host", "0.0.0.0", "--port", "8000", "--app-dir", "/app/ui"]
    ports:
      - "${UI_BIND:-127.0.0.1}:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
